name: Draft release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write # create draft releases

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history: verify the tag descends from main
          persist-credentials: false # nothing here needs git credentials

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify tag descends from main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on main; changes must land via PR first"
            exit 1
          fi

      - name: Verify tag matches root version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$root_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match root package version ${root_version}"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --draft
          fi
