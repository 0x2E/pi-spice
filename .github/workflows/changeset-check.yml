name: Changeset check

# A PR that changes extensions/** must add a changeset declaring every touched
# extension — otherwise the change ships undocumented and unversioned.
on:
  pull_request:
    paths:
      - "extensions/**"

permissions:
  contents: read

jobs:
  check:
    # the bot's own Version PR (branch changeset-release/*) bumps
    # extensions/*/package.json without adding changesets
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      - name: Extension changes require a changeset declaring them
        run: node scripts/check-changesets.mjs "origin/${{ github.base_ref }}"
