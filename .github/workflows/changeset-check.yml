name: Changeset check

# A PR that changes extensions/** must add a changeset declaring each touched
# extension plus @pi-spice/all — otherwise the change ships undocumented and
# unversioned (or silently rides along inside the next release).
on:
  pull_request:
    paths:
      - "extensions/**"

permissions:
  contents: read

jobs:
  check:
    # the bot's own Version PR bumps extensions/*/package.json without adding changesets
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Extension changes require a changeset with @pi-spice/all
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=ACMR "${base}...HEAD")

          ext_changed=$(grep -E '^extensions/' <<<"$changed" || true)
          cs_added=$(grep -E '^\.changeset/[^/]+\.md$' <<<"$changed" | grep -vE '^\.changeset/README\.md$' || true)

          if [ -z "$ext_changed" ]; then
            echo "no extension changes in this PR"
            exit 0
          fi

          if [ -z "$cs_added" ]; then
            echo "::error::this PR changes extensions/ but adds no changeset — add .changeset/<name>.md declaring each touched extension plus @pi-spice/all"
            exit 1
          fi

          status=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            frontmatter=$(awk '/^---$/{n++; next} n==1' "$f")
            if grep -qE '^"@pi-spice/' <<<"$frontmatter" &&
               ! grep -qE '^"@pi-spice/all":' <<<"$frontmatter"; then
              echo "::error::$f bumps an extension but omits the @pi-spice/all entry"
              status=1
            fi
          done <<<"$cs_added"
          exit $status
