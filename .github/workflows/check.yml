name: Check

# Typecheck + smoke for every PR: the smoke harness pins the extension to
# pi's real arg shapes and result-text formats, so host drift and summary
# regressions fail here instead of in a user's terminal.
on:
  pull_request:
    paths:
      - "extensions/**"
      - "scripts/**"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
