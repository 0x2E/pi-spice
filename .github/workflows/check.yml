name: Check

# Typecheck + smoke for every PR: the smoke harness pins the extension to
# pi's real arg shapes and result-text formats, so host drift and summary
# regressions fail here instead of in a user's terminal.
on:
  pull_request:
    paths:
      - "extensions/**"
      - "scripts/**"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
