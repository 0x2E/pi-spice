name: Publish

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write # create GitHub releases
  id-token: write # npm provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history: verify the tag descends from main
          persist-credentials: false # nothing here needs git credentials

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag descends from main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on main; changes must land via PR first"
            exit 1
          fi

      - name: Verify tag matches root version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$root_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match root package version ${root_version}"
            exit 1
          fi

      - name: Publish packages not yet on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          published=""
          for dir in extensions/*/ .; do
            pkg="${dir%/}/package.json"
            [ -f "$pkg" ] || { echo "skip $dir: no package.json"; continue; }
            name=$(node -p 'require(process.argv[1]).name' "./$pkg")
            version=$(node -p 'require(process.argv[1]).version' "./$pkg")
            if npm view "$name@$version" version >/dev/null 2>/tmp/npm-view.err; then
              echo "skip $name@$version (already published)"
            elif grep -q E404 /tmp/npm-view.err; then
              echo "publish $name@$version"
              (cd "$dir" && npm publish --access public --provenance --ignore-scripts)
              published="$published $name@$version"
            else
              cat /tmp/npm-view.err
              echo "::error::npm view failed for $name@$version (not a 404); aborting"
              exit 1
            fi
          done
          echo "published:$published"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
