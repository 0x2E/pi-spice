name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create GitHub releases
  id-token: write # npm provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches root version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$root_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match root package version ${root_version}"
            exit 1
          fi

      - name: Publish packages not yet on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          published=""
          for dir in extensions/*/ .; do
            pkg="${dir%/}/package.json"
            [ -f "$pkg" ] || { echo "skip $dir: no package.json"; continue; }
            name=$(node -p "require('./${pkg}').name")
            version=$(node -p "require('./${pkg}').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
            else
              echo "publish $name@$version"
              (cd "$dir" && npm publish --access public --provenance)
              published="$published $name@$version"
            fi
          done
          echo "published:$published"

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
